name: Sync CS.MONEY reference quotes

on:
  schedule:
    # Four snapshots/hour = approx. 2,880 calls per 30 days (plus JWT auth).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casecrow-csmoney-market-quotes
  cancel-in-progress: false

jobs:
  csmoney:
    # GitHub runs scheduled workflows only on the repository's default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      CSMARKETCAP_API_KEY: ${{ secrets.CSMARKETCAP_API_KEY }}
    steps:
      - name: Check required credentials
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing SUPABASE_DATABASE_URL secret"; exit 1; }
          test -n "$CSMARKETCAP_API_KEY" || { echo "Missing CSMARKETCAP_API_KEY secret"; exit 1; }
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @cs2-cases/api prisma:generate
      - name: Sync CS.MONEY quotes
        run: pnpm --filter @cs2-cases/api prisma:sync-csmoney
