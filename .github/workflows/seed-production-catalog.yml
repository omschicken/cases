name: Seed production case catalog

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type MIGRATE_SCHEMA to apply migrations or SEED_CATALOG to write the catalog
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-case-catalog-seed
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'MIGRATE_SCHEMA'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Check database secret
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Add SUPABASE_DATABASE_URL in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Prisma migrations
        run: pnpm --filter @cs2-cases/api prisma:deploy

  seed:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.confirm == 'SEED_CATALOG'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Check database secret
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Add SUPABASE_DATABASE_URL in GitHub Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @cs2-cases/api prisma:generate
      - name: Seed catalog
        run: pnpm --filter @cs2-cases/api prisma:seed
