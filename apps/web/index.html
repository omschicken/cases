<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("casecrow:theme");
          var dark = pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.casecrowTheme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.casecrowTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="/fonts/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="description"
      content="CaseCrow — коллекция CS2-кейсов с независимо проверяемыми результатами."
    />
    <link
      rel="icon"
      type="image/png"
      href="/favicon-32.png"
    />
    <meta property="og:title" content="CaseCrow — CS2-кейсы с характером" />
    <meta property="og:description" content="Собирайте CS2-предметы в премиальной коллекции CaseCrow. Каждый результат можно проверить." />
    <meta property="og:site_name" content="CaseCrow" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f5f2ea" />
    <title>CaseCrow — CS2-кейсы с характером</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
